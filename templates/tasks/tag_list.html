{% extends "base.html" %}

{% block title %}
  <title>Tags</title>
{% endblock %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Tags</h1>
    <a href="{% url "tasks:tag-create" %}" class="btn btn-primary">
      Add
    </a>
  </div>
  <table class="table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Update</th>
        <th>Delete</th>
      </tr>
    </thead>
    <tbody>
      {% for tag in tag_list %}
        <tr>
          <td>{{ tag.name }}</td>
          <td>
            <a href="{% url "tasks:tag-update" tag.id%}"
               class="btn btn-secondary">
              Update
            </a>
          </td>
          <td>
            <a href="{% url "tasks:tag-delete" tag.id%}"
               class="btn btn-secondary">
              Delete
            </a>
          </td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="3">There are no tags.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
